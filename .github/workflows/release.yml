name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (linux-amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test --no-restore -c Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Verify code coverage thresholds
        run: |
          python -c '
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("tests/**/TestResults/**/coverage.cobertura.xml", recursive=True)
          if not files:
              print("ERROR: No coverage.cobertura.xml found!")
              sys.exit(1)
          tree = ET.parse(files[0])
          root = tree.getroot()
          line_rate = float(root.attrib.get("line-rate", 0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
          print(f"Verified Code Coverage - Line: {line_rate:.2f}%, Branch: {branch_rate:.2f}%")
          if line_rate < 80.0 or branch_rate < 80.0:
              print("ERROR: Code coverage dropped below 80% threshold!")
              sys.exit(1)
          print("SUCCESS: Code coverage threshold (>= 80%) met.")
          '

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results-release
          path: tests/**/TestResults/**/*.xml

      - name: Publish (linux-x64, self-contained, single file)
        run: |
          dotnet publish \
            abaci-bot.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: abaci-bot-linux-amd64
          path: ./publish/abaci-bot

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: abaci-bot-linux-amd64
          path: ./dist

      - name: Make binary executable
        run: chmod +x ./dist/abaci-bot

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/abaci-bot
          generate_release_notes: true
